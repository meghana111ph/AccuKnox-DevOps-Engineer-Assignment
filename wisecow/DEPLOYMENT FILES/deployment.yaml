
apiVersion: apps/v1
kind: Deployment

metadata:
  name: wisecow-deployment
  labels:
    app: wisecow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: wisecow

  template:
    metadata:
      labels:
        app: wisecow

    spec:
      containers:
        - name: wisecow
          image: wisecow:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4499
              name: http

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
